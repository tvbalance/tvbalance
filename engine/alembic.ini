# Development only: generating new revisions. The engine runs its migrations programmatically.
#   uv run alembic -c engine/alembic.ini upgrade head
#   uv run alembic -c engine/alembic.ini revision --autogenerate -m "describe the change" --rev-id 0002
[alembic]
script_location = engine/src/tvbalance/infra/db/migrations
sqlalchemy.url = sqlite:///.tmp/alembic-dev.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
