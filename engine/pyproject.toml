[project]
name = "tvbalance"
version = "0.0.1"
description = "TVBalance Engine: local-first parental control for smart TVs"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "cryptography>=44",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "sqlalchemy[asyncio]>=2.0",
  "tzdata>=2024.2",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
tvbalance = "tvbalance.__main__:main"

[project.entry-points."tvbalance.adapters"]
fake = "tvbalance.sdk.fake:PLUGIN"

[project.entry-points."tvbalance.adapter_harnesses"]
fake = "tvbalance.sdk.fake:_harness"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvbalance"]
