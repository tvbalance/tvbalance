name: TVBalance
version: "0.0.1"
slug: tvbalance
description: Healthy screen-time rules for your family's smart TV
url: https://github.com/tvbalance/tvbalance
arch:
  - amd64
  - aarch64
image: ghcr.io/tvbalance/tvbalance-addon-{arch}
init: false
# TV discovery (SSDP/mDNS/DIAL) and Wake-on-LAN need the host network.
host_network: true
ingress: true
ingress_port: 8765
panel_icon: mdi:television-play
panel_title: TVBalance
# The Supervisor API is used to announce the Engine to Home Assistant (integration discovery).
hassio_api: true
discovery:
  - tvbalance
