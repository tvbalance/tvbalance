[project]
name = "tvbalance-workspace"
version = "0.0.0"
description = "TVBalance monorepo workspace root (not published)"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "adapters/*", "client"]

[tool.uv.sources]
tvbalance = { workspace = true }
tvbalance-client = { workspace = true }
tvbalance-adapter-webos = { workspace = true }
tvbalance-adapter-roku = { workspace = true }
tvbalance-adapter-androidtv = { workspace = true }
tvbalance-adapter-samsung = { workspace = true }

[dependency-groups]
dev = [
  "tvbalance",
  "tvbalance-client",
  "tvbalance-adapter-webos",
  "tvbalance-adapter-roku",
  "tvbalance-adapter-androidtv",
  "tvbalance-adapter-samsung",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["tvbalance", "tvbalance_client", "tvbalance_adapter_webos"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = ["engine/src", "client/src", "adapters/webos/src", "adapters/roku/src", "adapters/androidtv/src", "adapters/samsung/src"]
explicit_package_bases = true

[tool.coverage.run]
# SQLAlchemy's async layer runs its sync callbacks in greenlets.
concurrency = ["greenlet", "thread"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["engine/tests", "client/tests", "adapters"]
addopts = "-q --basetemp=.tmp/pytest -m \"not hardware and not hardware_actions\""
markers = [
  "hardware: read-only checks against a real TV (needs TVBALANCE_WEBOS_HOST and TVBALANCE_WEBOS_KEY)",
  "hardware_actions: commands that change the real TV; run only in a supervised manual session",
]
