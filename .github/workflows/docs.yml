name: Docs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --only-group docs --frozen
      - run: python scripts/check_docs_i18n.py
      - run: uv run --only-group docs --frozen mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
