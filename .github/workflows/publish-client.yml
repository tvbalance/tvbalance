name: Publish client

on:
  push:
    tags: ["client-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_release.py "$GITHUB_REF_NAME"
      - uses: astral-sh/setup-uv@v6
      - run: uv build --package tvbalance-client --out-dir dist
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: configure the publisher on PyPI for this workflow and the "pypi" environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
