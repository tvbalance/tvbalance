name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Standalone Docker installs: one multi-arch image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/tvbalance/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tvbalance:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tvbalance:latest
      # Home Assistant Add-on: Supervisor resolves `image: ...-{arch}` per architecture.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/tvbalance/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tvbalance-addon-amd64:${{ steps.meta.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/tvbalance/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tvbalance-addon-aarch64:${{ steps.meta.outputs.version }}
