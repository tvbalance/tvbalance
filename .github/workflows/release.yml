name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_release.py "$GITHUB_REF_NAME"

  images:
    name: Publish images
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Standalone Docker installs: one multi-arch image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/tvbalance/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tvbalance:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tvbalance:latest
      # Home Assistant Add-on: Supervisor resolves `image: ...-{arch}` per architecture.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/tvbalance/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_ARCH=amd64
          tags: ghcr.io/${{ github.repository_owner }}/tvbalance-addon-amd64:${{ steps.meta.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/tvbalance/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_ARCH=aarch64
          tags: ghcr.io/${{ github.repository_owner }}/tvbalance-addon-aarch64:${{ steps.meta.outputs.version }}

  # HACS needs the integration at the root of its own repository, so each release is mirrored there.
  # Skipped until the HACS_MIRROR_TOKEN secret (write access to the mirror repository) exists.
  hacs-mirror:
    name: Mirror the integration for HACS
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HACS_MIRROR_TOKEN: ${{ secrets.HACS_MIRROR_TOKEN }}
      MIRROR_REPO: ${{ github.repository_owner }}/tvbalance-ha
    steps:
      - if: env.HACS_MIRROR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          path: source
      - if: env.HACS_MIRROR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MIRROR_REPO }}
          token: ${{ env.HACS_MIRROR_TOKEN }}
          path: mirror
      - if: env.HACS_MIRROR_TOKEN != ''
        name: Publish the mirror
        env:
          GH_TOKEN: ${{ env.HACS_MIRROR_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd mirror
          git rm -rq --ignore-unmatch .
          mkdir -p custom_components
          cp -r ../source/ha/custom_components/tvbalance custom_components/tvbalance
          cp ../source/ha/hacs/hacs.json ../source/ha/hacs/README.md .
          cp ../source/LICENSE .
          find . -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "TVBalance Maintainers"
          git config user.email "maintainers@tvbalance.dev"
          git add -A
          git commit -m "Release ${version}" || echo "nothing changed"
          git tag -f "v${version}"
          git push origin HEAD "v${version}" --force
          gh release create "v${version}" --repo "${MIRROR_REPO}" --title "TVBalance ${version}" \
            --notes "Mirror of TVBalance ${version}." || echo "release already exists"
