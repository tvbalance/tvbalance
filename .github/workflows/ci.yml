name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine, adapters and client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy engine/src client/src adapters/webos/src adapters/roku/src adapters/androidtv/src adapters/samsung/src
      # Includes the OpenAPI drift test: engine/openapi.json must match the app.
      - run: uv run pytest --cov=tvbalance.domain --cov=tvbalance.infra --cov=tvbalance.app --cov-branch --cov-fail-under=95

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: No absolute API paths in the bundle (Ingress safety)
        run: "! grep -rn '\"/api' dist/assets"

  homeassistant:
    name: Home Assistant (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 resolves the oldest supported Home Assistant, 3.14 the latest.
        python: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: ha
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The integration lives under ha/ in the monorepo; hassfest expects the standard layout.
      - run: cp -r ha/custom_components ./custom_components
      - uses: home-assistant/actions/hassfest@master

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/tvbalance/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
