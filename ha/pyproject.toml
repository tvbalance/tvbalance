[project]
name = "tvbalance-ha-tests"
version = "0.0.0"
description = "Test environment for the Home Assistant integration (not published)"
requires-python = ">=3.13"
dependencies = [
  "tvbalance-client",
  "pytest-homeassistant-custom-component",
]

[tool.uv]
package = false

[tool.uv.sources]
tvbalance-client = { path = "../client", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["."]
