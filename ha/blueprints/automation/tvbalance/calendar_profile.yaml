blueprint:
  name: TVBalance - switch a rule set on with a calendar
  description: >
    Turn a TVBalance rule set on for the whole household while a Home Assistant calendar event is
    running, for example "Holidays" or "Grandparents' weekend", and turn it off when the event ends.
    Needs the Pro plan; the Home Assistant user running the automation does not matter.
  domain: automation
  author: TVBalance
  homeassistant:
    min_version: 2024.10.0
  input:
    calendar:
      name: Calendar
      selector:
        entity:
          domain: calendar
    policy_id:
      name: Rule set ID
      description: The number of the rule set, shown in the Engine's address bar when you edit it.
      selector:
        number:
          min: 1
          mode: box
    excluded:
      name: TVs to leave out
      description: These TVs keep following their own rules.
      default: []
      selector:
        device:
          integration: tvbalance
          multiple: true

mode: single
max_exceeded: silent

triggers:
  - trigger: calendar
    event: start
    entity_id: !input calendar
    id: start
  - trigger: calendar
    event: end
    entity_id: !input calendar
    id: end

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: start
        sequence:
          - action: tvbalance.activate_profile
            data:
              policy_id: !input policy_id
              excluded_device_ids: !input excluded
              minutes: 1440
      - conditions:
          - condition: trigger
            id: end
        sequence:
          - action: tvbalance.stop_profile
