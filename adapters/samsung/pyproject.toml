[project]
name = "tvbalance-adapter-samsung"
version = "0.0.1"
description = "TVBalance adapter for Samsung Tizen"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = ["tvbalance"]

[project.entry-points."tvbalance.adapters"]
samsung = "tvbalance_adapter_samsung:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvbalance_adapter_samsung"]
