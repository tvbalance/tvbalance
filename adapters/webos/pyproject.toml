[project]
name = "tvbalance-adapter-webos"
version = "0.0.1"
description = "TVBalance adapter for LG webOS"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = ["tvbalance"]

[project.entry-points."tvbalance.adapters"]
webos = "tvbalance_adapter_webos:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvbalance_adapter_webos"]
