[project]
name = "tvbalance-adapter-androidtv"
version = "0.0.1"
description = "TVBalance adapter for Google TV / Android TV"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = ["tvbalance"]

[project.entry-points."tvbalance.adapters"]
androidtv = "tvbalance_adapter_androidtv:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvbalance_adapter_androidtv"]
