[project]
name = "tvbalance-adapter-roku"
version = "0.0.1"
description = "TVBalance adapter for Roku TV"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = ["tvbalance"]

[project.entry-points."tvbalance.adapters"]
roku = "tvbalance_adapter_roku:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvbalance_adapter_roku"]
